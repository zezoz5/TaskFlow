services:
  api:
    build:
      context: .
      dockerfile: TaskManager.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=TaskFlowDb;User Id=${DB_USERNAME};Password=${DB_PASSWORD};TrustServerCertificate=True"
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    

volumes:
  sqlserver-data: