services:
  api:
    build:
      context: .
      dockerfile: TaskManager.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
        ASPNETCORE_ENVIRONMENT: Development
        ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=TaskFlowDb;User Id=${DB_USERNAME};Password=${DB_PASSWORD};TrustServerCertificate=True" 