name: Task Manger CI

# Run when Push to main
on:
  push:
    branches: { main }

jobs:
  build:
    # GitHub creates a temporary Ubuntu machine
    runs-on: ubuntu-latest

    steps:
      # Get repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup dotnet environment
      - name: Setups dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Compile the project
      - name: Build
        run: dotnet build

      # Run tests
      - name: Test
        run: dotnet test
