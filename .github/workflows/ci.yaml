name: Task Manager CI

# Run when Push to main
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    # GitHub creates a temporary Ubuntu machine
    runs-on: ubuntu-latest

    env:
      TEST_CONNECTION_STRING: "Server=localhost,14330;Database=TaskFlowDb_Test;User Id=sa;Password=${{ secrets.CI_DB_PASSWORD }};TrustServerCertificate=True"
      Jwt__Key: ${{ secrets.CI_JWT_KEY }}
      Jwt__Issuer: "TaskFlowAPI"
      Jwt__Audience: "TaskFlowClient"
      Jwt__ExpireDays: "7"

    services:
      db:
        image: mcr.microsoft.com/mssql/server:2025-latest

        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

        ports:
          - 14330:1433

        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      steps:
        # Get repository
        - name: Checkout code
          uses: actions/checkout@v4

        # Setup dotnet environment
        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: "10.0.x"

        # Compile the project
        - name: Build
          run: dotnet build

        # Run tests
        - name: Test
          run: dotnet test

  deploy:
    needs: build
    if: github.even_name=='push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}