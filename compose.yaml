services:
  api:

    build:
      context: .
      dockerfile: TaskManager.API/Dockerfile

    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=TaskFlowDb;User Id=${DB_USERNAME};Password=${DB_PASSWORD};TrustServerCertificate=True"

    depends_on:
      db:
        condition: service_healthy

  db:

    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"

    ports:
      - "14330:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql
      
    healthcheck:
      test: ["CMD-SHELL","/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -No -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
    

volumes:
  sqlserver-data: